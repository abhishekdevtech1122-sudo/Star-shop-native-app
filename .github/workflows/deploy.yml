name: Deploy Flutter Web

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Auto-Fix Project Structure & Missing Files
        run: |
          # अगर screens फोल्डर बाहर है तो उसे lib के अंदर मूव करो
          if [ -d "screens" ]; then
            mkdir -p lib/screens
            cp -r screens/* lib/screens/
          fi
          # अपनी असली फाइलों का बैकअप लो
          cp -r lib /tmp/backup_lib
          # सर्वर पर खुद pubspec.yaml और web फोल्डर जनरेट कराओ
          flutter create . --project-name star_shop_app --platforms web
          # अपनी असली फाइलें वापस प्रोजेक्ट में डालो
          cp -r /tmp/backup_lib/* lib/

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --base-href "/Star-shop-native-app/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
